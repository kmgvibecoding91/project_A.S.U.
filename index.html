<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT F.A.Q. — база знаний ИТ</title>
<meta name="description" content="Корпоративный портал базы знаний ИТ: инструкции, топ проблем, заявки в SMAX, AI-ассистент. Прототип по PRD v1.0.">
<style>
:root{
  --bg:#f4f6f9;--surface:#fff;--surface2:#eef2f6;--text:#16202a;--muted:#5a6775;--line:#dde3ea;
  --brand:#0b5cab;--brand2:#084a8c;--brand-soft:#e6f0fa;--on-brand:#fff;--accent:#00968f;
  --ok:#1b7f4c;--ok-soft:#e4f4eb;--warn:#8f5600;--warn-soft:#fff3dc;--bad:#c0392b;--bad-soft:#fdecea;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);--r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1419;--surface:#171e26;--surface2:#1f2832;--text:#e6ebf0;--muted:#9aa7b4;--line:#2b3641;
  --brand:#4d9bf0;--brand2:#7db6f5;--brand-soft:#16304d;--on-brand:#06111d;--accent:#3cc7bd;
  --ok:#4cc38a;--ok-soft:#14301f;--warn:#f0b453;--warn-soft:#33270f;--bad:#f2786d;--bad-soft:#3a1b19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1419;--surface:#171e26;--surface2:#1f2832;--text:#e6ebf0;--muted:#9aa7b4;--line:#2b3641;
  --brand:#4d9bf0;--brand2:#7db6f5;--brand-soft:#16304d;--on-brand:#06111d;--accent:#3cc7bd;
  --ok:#4cc38a;--ok-soft:#14301f;--warn:#f0b453;--warn-soft:#33270f;--bad:#f2786d;--bad-soft:#3a1b19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow-x:hidden}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}
h1{font-size:30px}h2{font-size:20px}h3{font-size:16px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.small{font-size:13px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
mark{background:#ffe58a;color:inherit;border-radius:3px;padding:0 1px}
@media (prefers-color-scheme:dark){mark{background:#6b5a12}}

/* header */
header.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:14px;min-height:62px}
.logo{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none!important;flex:none}
.lmark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:.5px}
.logo b{display:block;font-size:16px}.logo small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
nav#nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
nav#nav a{padding:8px 11px;border-radius:9px;color:var(--text);font-size:14px;white-space:nowrap}
nav#nav a:hover{background:var(--surface2);text-decoration:none}
nav#nav a.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.tools{display:flex;align-items:center;gap:10px;flex:none}
.langsw{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.langsw button{border:0;background:transparent;color:var(--muted);padding:6px 10px;font-weight:600;cursor:pointer;font-size:13px}
.langsw button.on{background:var(--brand);color:var(--on-brand)}
.rolesel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
select,input,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
textarea{width:100%;resize:vertical}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:6px 10px;font-size:18px;cursor:pointer;margin-left:auto}
@media (max-width:1020px){
  .hrow{flex-wrap:wrap;padding:8px 0}
  .menu-btn{display:block}
  nav#nav{display:none;order:5;flex-basis:100%;flex-direction:column;padding-bottom:8px}
  header.open nav#nav{display:flex}
  .tools{order:4;flex-basis:100%;justify-content:space-between}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none!important;line-height:1.2}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand2);border-color:var(--brand2)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn[aria-pressed="true"]{outline:2px solid var(--brand)}

/* search */
.sbox{position:relative;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 5px 5px 12px;box-shadow:var(--shadow)}
.sbox:focus-within{border-color:var(--brand)}
.sbox input{flex:1;border:0;background:transparent;padding:8px 4px;min-width:0;outline:none}
.sbox .sico{opacity:.6}
.sbox.big{padding:8px 8px 8px 18px;border-radius:16px}
.sbox.big input{font-size:18px;padding:10px 4px}
.ac{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:30;text-align:left}
.ac a,.ac .acx{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;color:var(--text);text-decoration:none;border-bottom:1px solid var(--line)}
.ac a:last-child{border-bottom:0}
.ac a.sel,.ac a:hover{background:var(--brand-soft)}
.ac small{color:var(--muted);white-space:nowrap}
.subsearch{background:var(--surface2);border-bottom:1px solid var(--line);padding:10px 0}
.subsearch .sbox{box-shadow:none}

/* hero */
.hero{background:radial-gradient(1200px 300px at 10% -40%,var(--brand-soft),transparent),linear-gradient(180deg,var(--surface),var(--bg));padding:46px 0 30px;border-bottom:1px solid var(--line)}
.hero h1{font-size:36px}
.hero p{color:var(--muted);font-size:17px;max-width:680px;margin:0 0 20px}
.hero .sbox{max-width:780px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)}
.chip{display:inline-block;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:13px}
.chip:hover{border-color:var(--brand);text-decoration:none}

/* layout pieces */
main{min-height:60vh;padding-bottom:40px}
.page{padding:24px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:22px}
@media (max-width:1020px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:600px){.tiles{grid-template-columns:1fr 1fr}}
.tile{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--text);box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--brand);text-decoration:none}
.tile .ic{font-size:26px}
.tile b{display:block;margin:6px 0 2px}
.tile span{font-size:13px;color:var(--muted)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-head h2{margin:0}
.toplist{list-style:none;margin:0;padding:0}
.toplist li a{display:flex;align-items:center;gap:12px;padding:9px 6px;border-bottom:1px solid var(--line);color:var(--text)}
.toplist li:last-child a{border-bottom:0}
.toplist li a:hover{background:var(--surface2);text-decoration:none}
.rank{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.toplist .tt{flex:1}
.cnt{font-size:13px;color:var(--muted);white-space:nowrap}
.trend{font-weight:800;margin-left:4px}
.trend.up{color:var(--bad)}.trend.down{color:var(--ok)}.trend.flat{color:var(--muted)}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.blue{background:var(--brand-soft);color:var(--brand)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--r);padding:12px 16px;margin-top:20px}
.banner .x{margin-left:auto;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:16px;background:linear-gradient(120deg,var(--brand-soft),var(--surface));border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.cta h3{margin:0 0 4px;font-size:18px}
.cta p{margin:0;color:var(--muted)}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted)}
.crumbs span{margin:0 6px}

/* article list */
.alist{display:grid;gap:10px}
.aitem{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--text)}
.aitem:hover{border-color:var(--brand);text-decoration:none}
.aitem h3{margin:0 0 4px;color:var(--brand);font-size:16px}
.aitem p{margin:0 0 8px;color:var(--muted);font-size:14px}
.aitem .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:860px){.cats{grid-template-columns:1fr}}
.catcard{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--text);box-shadow:var(--shadow)}
.catcard:hover{border-color:var(--brand);text-decoration:none}
.catcard .h{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.catcard .h .ic{font-size:24px}
.catcard ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px}

/* article */
.art{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}
@media (max-width:960px){.art{grid-template-columns:1fr}.aside{order:-1}}
.art h1{font-size:28px}
.ameta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:12px}
.asec{scroll-margin-top:80px;padding-top:6px}
.asec+.asec{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}
.asec h2{font-size:18px}
.tldr{background:var(--brand-soft);border-radius:12px;padding:12px 16px;font-size:16px}
ol.steps{list-style:none;counter-reset:s;padding:0;margin:0}
ol.steps li{counter-increment:s;position:relative;padding:10px 0 10px 46px;border-bottom:1px dashed var(--line)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700}
.callout{border-radius:12px;padding:12px 16px;margin:14px 0;border-left:4px solid}
.callout b{display:block;margin-bottom:2px}
.callout.warn{background:var(--warn-soft);border-color:var(--warn)}
.callout.tip{background:var(--ok-soft);border-color:var(--ok)}
.callout.info{background:var(--brand-soft);border-color:var(--brand)}
dl.errs{margin:0}
dl.errs dt{font-weight:600;margin-top:10px}
dl.errs dd{margin:2px 0 0;color:var(--muted)}
.aside{position:sticky;top:80px;display:grid;gap:12px}
@media (max-width:960px){.aside{position:static}}
.toc a{display:block;padding:5px 8px;border-radius:8px;color:var(--text);font-size:14px;cursor:pointer}
.toc a:hover{background:var(--surface2);text-decoration:none}
.stat{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.rate{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reasons{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.reasons label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.reasons input{accent-color:var(--brand)}
.metagrid{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.metagrid dt{color:var(--muted)}.metagrid dd{margin:0}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.tblwrap{overflow-x:auto}
pre.tpl{white-space:pre-wrap;background:var(--surface2);border-radius:10px;padding:12px 14px;font:13px/1.5 Consolas,ui-monospace,monospace;margin:8px 0}
.example{border-radius:12px;padding:14px 16px;border:1px solid var(--line)}
.example.bad{background:var(--bad-soft)}.example.good{background:var(--ok-soft)}
.example h3{margin-bottom:6px}

/* checklist */
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line)}
.chk li:last-child{border-bottom:0}
.chk input{width:19px;height:19px;margin-top:2px;accent-color:var(--ok);flex:none}
.chk li.done .ct{text-decoration:line-through;color:var(--muted)}
.chk .ct{flex:1}
.progress{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .3s}

/* top page */
.tabs{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.prob{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start}
.prob .rank{width:40px;height:40px;font-size:16px}
.prob .n{text-align:right;font-size:22px;font-weight:700}
.prob .n small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.prob ol{margin:6px 0 8px;padding-left:20px;font-size:14px}
.prob.gap{border-color:var(--warn);border-style:dashed}
.prob.hidden{opacity:.5}
.modbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:26px}
.kpi span{font-size:13px;color:var(--muted)}

/* chat */
#chatFab{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:13px 18px;background:var(--brand);color:var(--on-brand);font:inherit;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(11,92,171,.35)}
#chatFab:hover{background:var(--brand2)}
#chat{position:fixed;right:20px;bottom:20px;z-index:60;width:400px;max-width:calc(100vw - 32px);height:600px;max-height:calc(100vh - 40px);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
#chat[hidden]{display:none}
@media (max-width:600px){#chat{right:8px;left:8px;bottom:8px;width:auto;max-width:none;height:calc(100vh - 16px)}}
.chead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(120deg,var(--brand),var(--accent));color:#fff}
.chead b{flex:1}
.chead button{border:0;background:rgba(255,255,255,.2);color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
.cmsgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14px}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.msg ol{margin:4px 0 6px;padding-left:18px}
.msg.bot{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.user{background:var(--brand);color:var(--on-brand);align-self:flex-end;border-bottom-right-radius:4px}
.msg .src{font-size:13px;border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.msg .aifb{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
.msg .aifb button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 9px;cursor:pointer}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:3px;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.csugg{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0;background:var(--surface)}
.csugg button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.cform{display:flex;gap:8px;padding:10px 12px;background:var(--surface)}
.cform input{flex:1;min-width:0}
.cnote{font-size:11.5px;color:var(--muted);padding:0 12px 10px;background:var(--surface)}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,16,24,.5);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.mbox{position:relative;background:var(--surface);border-radius:18px;max-width:640px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mclose{position:absolute;right:12px;top:10px;border:0;background:transparent;color:var(--muted);font-size:24px;cursor:pointer}
.field{display:grid;gap:4px;margin-bottom:12px;font-size:14px}
.field>span{color:var(--muted);font-size:13px}
.field input,.field select{width:100%}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;display:grid;gap:8px;justify-items:center;pointer-events:none}
#toast div{background:#1d2733;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
footer{border-top:1px solid var(--line);background:var(--surface);padding:20px 0;color:var(--muted);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.empty{text-align:center;padding:30px 16px}
.empty .ic{font-size:44px}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mt{margin-top:16px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 16px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.dos{grid-template-columns:1fr}}
.dos ul{margin:0;padding-left:20px}
@media print{
  header.top,.subsearch,footer,#chatFab,#chat,.no-print,.aside{display:none!important}
  body{background:#fff;color:#000}.card{box-shadow:none;border:0;padding:0}.art{display:block}

  ARTICLES.forEach(a=>{
    add(a.t.ru+' '+(a.t.kz||''),a.id,3);
    add(a.tags+' '+CATS[a.cat].ru+' '+CATS[a.cat].kz,a.id,2.5);
    [a.ru,a.kz].filter(Boolean).forEach(c=>add([c.who,c.tldr,(c.need||[]).join(' '),(c.steps||[]).join(' '),c.check,(c.errors||[]).flat().join(' '),c.warn,c.tip].join(' '),a.id,1));
  });
  VOCAB = [...POST.keys()];
}
function vocabMatch(w){
  if(VM_CACHE.has(w)) return VM_CACHE.get(w);
  const out = new Map(), sw = stem(w), maxD = w.length>=7?2:1;
  for(const v of VOCAB){
    if(v===w){ out.set(v,1); continue; }
    if(w.length>=4 && v.length>=4 && (v.startsWith(sw) || w.startsWith(stem(v)))){ out.set(v,.8); continue; }
    if(w.length>=5 && Math.abs(v.length-w.length)<=maxD && lev(w,v)<=maxD) out.set(v,.6);
  }
  VM_CACHE.set(w,out); return out;
}
function expand(term){
  const out = new Map([[term,1]]);
  const gs = new Set(SYN_IDX.get(term)||[]);
  if(!gs.size && term.length>=5){ const st=stem(term); SYN.forEach((g,i)=>{ if(g.some(w=>w.length>=5 && (w.startsWith(st)||term.startsWith(stem(w))))) gs.add(i); }); }
  gs.forEach(i=>SYN[i].forEach(w=>{ if(!out.has(w)) out.set(w,.85); }));
  return [...out];
}
function termScores(term, matched){
  const out = new Map(); let total = 0;
  for(const [w,f] of expand(term)){
    for(const [v,q] of vocabMatch(w)){
      matched && matched.add(v);
      for(const [id,fw] of POST.get(v)){ const s=q*fw*f; if(s>(out.get(id)||0)) out.set(id,s); }
    }
  }
  out.forEach(s=>total+=s);
  return {out,total};
}
function search(q){
  const toks = tokenize(q); const matched = new Set();
  if(!toks.length) return {res:[],corrected:null,matched};
  const scores = new Map(), hits = new Map(); const corr = []; let swapped = false;
  toks.forEach(tok=>{
    const variants = [tok]; const sw = swapLayout(tok);
    if(sw!==tok && (/^[a-z\[\];',.`]+$/.test(tok) || /^[а-яё]+$/.test(tok))) variants.push(norm(sw).replace(/ /g,''));
    let best = null;
    variants.forEach((v,i)=>{ if(!v) return; const r = termScores(v); if(!best || r.total > best.total*1.5 && i>0 || (i===0 && !best)) best = {...r,v,i}; });
    if(best.i>0 && best.total>0) swapped = true;
    termScores(best.v, matched);
    corr.push(best.v);
    best.out.forEach((s,id)=>{ scores.set(id,(scores.get(id)||0)+s); hits.set(id,(hits.get(id)||0)+1); });
  });
  const res = [...scores].map(([id,s])=>{ const cov=hits.get(id)/toks.length; return {id,score:s*(.5+.5*cov),cov}; })
    .filter(r=>r.score>=0.9 && art(r.id)).sort((a,b)=>b.score-a.score);
  return {res, corrected: swapped ? corr.join(' ') : null, matched};
}
function hl(text, matched){
  const e = esc(text); if(!matched || !matched.size) return e;
  return e.replace(/[A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі0-9-]+/g, w => matched.has(norm(w).replace(/ /g,'')) ? `<mark>${w}</mark>` : w);
}

function render(){
  const h = location.hash.slice(1) || '/';
  const [path, qs] = h.split('?'); const p = path.split('/').filter(Boolean); const q = new URLSearchParams(qs||'');
  let html, r = p[0]||'';
  switch(r){
    case '': html = viewHome(); break;
    case 'new': html = viewNew(); break;
    case 'kb': html = viewKb(p[1]); break;
    case 'article': html = viewArticle(p[1]); break;
    case 'search': html = viewSearch(q.get('q')||'', {cat:q.get('cat')||'',type:q.get('type')||'',dev:q.get('dev')||''}); break;
    case 'smax': html = viewSmax(); break;
    case 'top': html = viewTop(); break;
    case 'contacts': html = viewContacts(); break;
    case 'admin': html = viewAdmin(); break;
    default: html = viewNotFound();
  }
  renderChrome(r);
  $('#app').innerHTML = html;
  $('#hdr').classList.remove('open');
  const h1 = $('#app h1'); document.title = (h1 && r ? h1.textContent.replace(/^[^\wА-Яа-яӘ-ӨҚ-Ү]+/,'')+' — ' : '') + 'IT F.A.Q.';
}

function toast(msg){ const d=document.createElement('div'); d.textContent=msg; $('#toast').appendChild(d); setTimeout(()=>d.remove(),3200); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); }catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy')}catch(_){} ta.remove(); } toast(t('copied')); }

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el){ if(!e.target.closest('.sbox')) document.querySelectorAll('.ac').forEach(x=>x.hidden=true); return; }
  const act = el.dataset.act;
  switch(act){
    case 'menu': $('#hdr').classList.toggle('open'); break;
    case 'lang': state.lang = el.dataset.l; store.set('lang',state.lang); render(); if(!$('#chat').hidden) resetChatIfEmpty(); break;
    case 'scroll': { const s=document.getElementById(el.dataset.to); s && s.scrollIntoView({behavior:'smooth'}); break; }
    case 'copylink': copy(location.href).then(()=>{}); break;
    case 'print': window.print(); break;
    case 'smax': smaxModal({id:el.dataset.id, cat:el.dataset.cat, type:el.dataset.type}); break;
    case 'copy-smax': copy($('#smaxTplTa').value); break;
    case 'open-smax': if(CONFIG.smaxUrl) window.open(CONFIG.smaxUrl+'?category='+encodeURIComponent(window._smaxCat),'_blank','noopener'); else toast(t('smaxDemo')); break;
    case 'copy-tpl': copy(TEMPLATES[+el.dataset.i].text); break;
    case 'modal-close': closeModal(); break;
    case 'banner-off': store.set('bannerOff',today()); el.closest('.banner').remove(); break;
    case 'vote': {
      const id = el.dataset.id, v = el.dataset.v; const votes = store.get('votes',{}); if(votes[id]) break;
      votes[id] = v; store.set('votes',votes); toast(t('thanks'));
      const box = $('#rate'); if(v==='down') box.innerHTML = feedbackForm(art(id)); else box.innerHTML = rateWidget(art(id));
      break; }
    case 'period': state.period = el.dataset.p; render(); break;
    case 'pin': case 'hide': {
      const ov = store.get('topov',{pin:[],hide:[]}); const key = act==='pin'?'pin':'hide'; const id = el.dataset.id;
      ov[key] = ov[key].includes(id) ? ov[key].filter(x=>x!==id) : [...ov[key],id]; store.set('topov',ov); render(); break; }
    case 'ask-ai': openChat(el.dataset.q); break;
    case 'chat-open': openChat(); break;
    case 'chat-close': $('#chat').hidden = true; $('#chatFab').hidden = false; break;
    case 'chat-sugg': sendChat(el.textContent); break;
    case 'ai-vote': aiVote(el); break;
    case 'new-article': newArticleModal(); break;
    case 'approve': case 'reject': {
      const drafts = store.get('drafts',[]); const d = drafts.find(x=>x.id===el.dataset.id); if(!d) break;
      if(act==='approve'){ d.status='pub'; const a={...d}; delete a.status; a.st='pub'; const pubs=store.get('published',[]); pubs.push(a); store.set('published',pubs); ARTICLES.push(a); reindexIds(); buildIndex(); toast(t('published')); }
      else { d.status='draft'; toast(t('returned')); }
      store.set('drafts',drafts); render(); break; }
  }
});

  if(el.dataset.fbstatus){ const fb=store.get('feedback',SEED_FB); const f=fb.find(x=>x.id===el.dataset.fbstatus); if(f){ f.status=el.value; store.set('feedback',fb); toast('✔'); } }

document.addEventListener('submit', e=>{
  const f = e.target;
  if(f.matches('[data-search]')){ e.preventDefault(); const q=f.q.value.trim(); if(!q) return; const sel=f.querySelector('.ac a.sel'); if(sel){ location.hash=sel.getAttribute('href'); return; } lastLoggedEmpty=''; location.hash='#/search?q='+encodeURIComponent(q); return; }
  if(f.id==='fbForm'){ e.preventDefault(); const reasons=[...f.querySelectorAll('input[name=r]:checked')].map(i=>i.value); const comment=f.c.value.trim();
    if(!reasons.length && !comment){ toast(t('pickReason')); return; }
    const fb=store.get('feedback',SEED_FB); fb.push({id:'f'+Date.now(),art:f.dataset.id,reasons,comment,date:today(),status:'new'}); store.set('feedback',fb);
    toast('🔔 '+t('fbSent')); $('#rate').innerHTML = rateWidget(art(f.dataset.id)); return; }
  if(f.id==='naForm'){ e.preventDefault(); const steps=f.steps.value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,10);
    if(!f.t.value.trim() || !f.tldr.value.trim() || steps.length<2){ toast(t('naFill')); return; }
    const d={id:'u'+Date.now(),cat:f.cat.value,type:'guide',dev:['any'],upd:today(),au:'l2',v:0,up:0,dn:0,smax:'Общие вопросы → Консультация',status:'pending',
      t:{ru:f.t.value.trim()},tags:f.tags.value.trim()||'',ru:{who:f.who.value.trim(),tldr:f.tldr.value.trim(),need:[],steps,check:f.check.value.trim(),errors:[]}};
    const drafts=store.get('drafts',[]); drafts.push(d); store.set('drafts',drafts); closeModal(); toast('🔔 '+t('naSent')); if(location.hash.startsWith('#/admin')) render(); return; }
  if(f.id==='cform'){ e.preventDefault(); const v=$('#cin').value.trim(); if(v){ $('#cin').value=''; sendChat(v); } }
});

/* автодополнение в строке поиска */
let acTimer;
document.addEventListener('input', e=>{
  if(!e.target.classList.contains('js-search')) return;
  const inp = e.target, ac = inp.parentElement.querySelector('.ac');
  clearTimeout(acTimer);
  acTimer = setTimeout(()=>{
    const q = inp.value.trim(); if(q.length<2){ ac.hidden=true; return; }
    const {res,matched} = search(q);
    ac.innerHTML = res.length ? res.slice(0,6).map(r=>{ const a=art(r.id); return `<a href="#/article/${a.id}">${hl(title(a),matched)}<small>${CATS[a.cat].ic} ${esc(L(CATS[a.cat]))}</small></a>`; }).join('')
      : `<a href="javascript:void 0" data-act="ask-ai" data-q="${esc(q)}">🤖 ${t('noResultsAc')}</a>`;
    ac.hidden = false;
  }, 120);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(!$('#modal').hidden) closeModal(); document.querySelectorAll('.ac').forEach(x=>x.hidden=true); }
  if(!e.target.classList.contains('js-search')) return;
  const ac = e.target.parentElement.querySelector('.ac'); if(ac.hidden) return;
  const items=[...ac.querySelectorAll('a')]; let i=items.findIndex(x=>x.classList.contains('sel'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); items[i]&&items[i].classList.remove('sel'); i = e.key==='ArrowDown' ? (i+1)%items.length : (i-1+items.length)%items.length; items[i].classList.add('sel'); }
});
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });

/* ============================================================
   AI-ассистент (имитация Copilot Studio: отвечает только по статьям портала)
   ============================================================ */
const T2 = (lng,k) => I18N[lng][k] ?? I18N.ru[k];
function addMsg(who, html){ const d=document.createElement('div'); d.className='msg '+who; d.innerHTML=html; $('#cmsgs').appendChild(d); $('#cmsgs').scrollTop=1e9; return d; }
function resetChatIfEmpty(){ if($('#cmsgs').children.length<=1){ $('#cmsgs').innerHTML=''; addMsg('bot',`<p>${esc(t('chatHello'))}</p>`); } }
function openChat(q){
  $('#chat').hidden = false; $('#chatFab').hidden = true;
  if(!$('#cmsgs').children.length) addMsg('bot',`<p>${esc(t('chatHello'))}</p>`);
  if(q) sendChat(q); else $('#cin').focus();
}
function sendChat(text){
  addMsg('user', esc(text));
  const typing = addMsg('bot','<span class="typing"><span></span><span></span><span></span></span>');
  setTimeout(()=>{ typing.remove(); addMsg('bot', botAnswer(text)); }, 650);
}
function botAnswer(q){
  const lng = /[әғқңөұүһі]/i.test(q) ? 'kz' : /[а-яё]/i.test(q) ? 'ru' : state.lang;
  const n = norm(q);
  if(/(парол|password|құпиясөз)\w*\s*[:=]|мой пароль\s+\S|менің құпиясөзім\s+\S|my password is/i.test(q)) return `<p>🔐 ${esc(T2(lng,'ai_pwd'))}</p>`;
  if(/^(привет|здравствуй|здравствуйте|добрый день|сәлем|салем|сәлеметсіз бе|hello|hi)\b/.test(n) && tokenize(q).length<=2) return `<p>${esc(T2(lng,'ai_hi'))}</p>`;
  if(/(спасибо|благодарю|рахмет|рақмет|thanks)/.test(n) && tokenize(q).length<=3) return `<p>${esc(T2(lng,'ai_thx'))}</p>`;
  const {res} = search(q); const best = res[0];
  if(!best || best.score<2 || best.cov<0.5){
    const ai = store.get('aiMissed',SEED_AI); ai.push({q,date:today()}); store.set('aiMissed',ai);
    const cat = best ? art(best.id).smax : 'Общие вопросы → Консультация';
    return `<p>${esc(T2(lng,'ai_none'))}</p><p>${T2(lng,'ai_cat')}: <b>${esc(cat)}</b></p><button class="btn sm primary" data-act="smax" data-cat="${esc(cat)}">🎫 ${T2(lng,'createTicket')}</button>`;
  }
  const a = art(best.id); const useKz = lng==='kz' && a.kz; const c = useKz ? a.kz : a.ru;
  const ttl = a.t[lng] || a.t.ru; const steps = c.steps.slice(0,5);
  const also = res.slice(1,3).filter(r=>r.score>=2).map(r=>art(r.id));
  return `<p>${T2(lng,'ai_found')}</p>${lng==='kz'&&!a.kz?`<p class="small muted">${T2(lng,'ai_kzfb')}</p>`:''}
    <p><b>${esc(ttl)}</b><br>${esc(c.tldr)}</p><ol>${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${c.steps.length>5?`<p class="small">${T2(lng,'ai_more')}</p>`:''}
    <div class="src">📄 ${T2(lng,'ai_src')}: <a href="#/article/${a.id}">${esc(ttl)}</a>${also.length?`<br>${T2(lng,'ai_also')} ${also.map(x=>`<a href="#/article/${x.id}">${esc(x.t[lng]||x.t.ru)}</a>`).join(', ')}`:''}</div>
    <div class="aifb" data-lng="${lng}" data-id="${a.id}">${T2(lng,'ai_helped')} <button data-act="ai-vote" data-v="up">👍</button><button data-act="ai-vote" data-v="down">👎</button></div>`;
}
function aiVote(btn){
  const box = btn.closest('.aifb'); const lng = box.dataset.lng; const a = art(box.dataset.id);
  box.innerHTML = btn.dataset.v==='up' ? '✔' : '✖';
  if(btn.dataset.v==='up') addMsg('bot',`<p>${esc(T2(lng,'ai_ok'))}</p>`);
  else addMsg('bot',`<p>${esc(T2(lng,'ai_sorry'))} <b>${esc(a.smax)}</b></p><button class="btn sm primary" data-act="smax" data-id="${a.id}">🎫 ${T2(lng,'createTicket')}</button>`);
}
$('#cmsgs').addEventListener('click', e=>{ if(e.target.closest('a[href^="#/"]') && window.innerWidth<600){ $('#chat').hidden=true; $('#chatFab').hidden=false; } });

render(); lastPath = location.hash.split('?')[0];
</script>
